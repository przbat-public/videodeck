# Self-hosted stack: Elasticsearch + server + client.
#
#   docker compose up -d --build
#
# Point VIDEOS_FOLDER_PATH at your video library and mount it read-write into
# the server container (the path inside the container must match the env
# value). See docs/DEPLOYMENT.md.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    environment:
      - discovery.type=single-node
      # Security is off and the port below is bound to loopback: anything that
      # can reach 9200 can read and delete every index. Keep the binding on
      # loopback, or turn on xpack security and give the server credentials.
      - xpack.security.enabled=false
      # Elasticsearch is a rebuildable cache for this app, not the store of
      # record (the video folders are) — replicas are wasted I/O.
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - '127.0.0.1:9200:9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9200 >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

  server:
    build:
      # The Dockerfiles copy the workspace manifests from the repository root,
      # so the context is this directory. `..` pointed one level above the
      # checkout, where those files do not exist.
      context: .
      dockerfile: server/Dockerfile
    environment:
      - HOST=0.0.0.0
      - PORT=3001
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - VIDEOS_FOLDER_PATH=/videos
      # Generate one: openssl rand -hex 32
      - API_TOKEN=${API_TOKEN:-}
      - REQUIRE_API_TOKEN=${REQUIRE_API_TOKEN:-true}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      # One proxy hop (the client container) sits in front of the server, and
      # the rate limit counts per client IP. Remove this if you reach the
      # server directly and let a header decide who the client is.
      - TRUST_PROXY=${TRUST_PROXY:-1}
    volumes:
      # Replace /path/to/videos with your library root. The container user
      # (uid 1000) needs write access: the folder index, the archive and the
      # videos live there.
      - /path/to/videos:/videos
      # Queued jobs survive a container recreate, not just a restart.
      - queue-state:/app/state
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - '127.0.0.1:3001:3001'

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      # The UI container talks to the server on the browser's behalf and holds
      # the token for it: the browser sends no Authorization header of its own.
      - API_TOKEN=${API_TOKEN:-}
    depends_on:
      - server
    ports:
      - '127.0.0.1:3000:80'

volumes:
  es-data:
  queue-state:
