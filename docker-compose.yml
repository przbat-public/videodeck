# Self-hosted stack: Elasticsearch + server + client.
#
#   docker compose up -d --build
#
# Point VIDEOS_FOLDER_PATH at your video library and mount it read-write into
# the server container (the path inside the container must match the env
# value). See docs/DEPLOYMENT.md.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    # The JVM is the slowest thing in this stack to start and to stop, so it
    # gets both guards: a stop that is not deliberate leaves a translog to
    # recover, and that recovery is what turns the next boot slow.
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      - discovery.type=single-node
      # Security is off and the port below is bound to loopback: anything that
      # can reach 9200 can read and delete every index. Keep the binding on
      # loopback, or turn on xpack security and give the server credentials.
      - xpack.security.enabled=false
      # Elasticsearch is a rebuildable cache for this app, not the store of
      # record (the video folders are) — replicas are wasted I/O.
      # The heap sits at 1 GB rather than the 512 MB it used to be: a small
      # heap collects constantly once the index grows, and the slow answers
      # that follow arrive in the server as request timeouts, which look like
      # a connection problem from the outside.
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - '127.0.0.1:9200:9200'
    healthcheck:
      # Ask the cluster, not the root path. `/` answers as soon as the HTTP
      # layer is up, while everything behind this container needs a cluster
      # that accepts index work. The start period covers the JVM boot and any
      # translog recovery, and the retry budget after it covers a machine that
      # is busy with something else. Without the start period a cold or
      # recovering node ran out of retries, went unhealthy, and took the
      # server down with it: `depends_on` below refuses to start a dependency
      # that never reported healthy.
      test:
        [
          'CMD-SHELL',
          'curl -fs "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null || exit 1',
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  server:
    build:
      # The Dockerfiles copy the workspace manifests from the repository root,
      # so the context is this directory. `..` pointed one level above the
      # checkout, where those files do not exist.
      context: .
      dockerfile: server/Dockerfile
    # A host reboot brings the whole stack back, not just the database.
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=3001
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - VIDEOS_FOLDER_PATH=/videos
      # Generate one: openssl rand -hex 32
      - API_TOKEN=${API_TOKEN:-}
      - REQUIRE_API_TOKEN=${REQUIRE_API_TOKEN:-true}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Summary providers: with both keys set DeepSeek answers, and
      # SUMMARY_PROVIDER (openai|deepseek) pins the choice. DEEPSEEK_MODEL takes
      # a model name or `name:effort`, e.g. deepseek-v4-pro:high.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-}
      - SUMMARY_PROVIDER=${SUMMARY_PROVIDER:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      # One proxy hop (the client container) sits in front of the server, and
      # the rate limit counts per client IP. nginx forwards X-Forwarded-For, so
      # this describes the connection rather than trusting a header. Remove it
      # when the server is reached directly, and never set a bare `true`: the
      # server refuses it, because it lets a client pick its own bucket.
      - TRUST_PROXY=${TRUST_PROXY:-1}
    volumes:
      # Replace /path/to/videos with your library root. The container user
      # (uid 1000) needs write access: the folder index, the archive and the
      # videos live there.
      - /path/to/videos:/videos
      # Queued jobs survive a container recreate, not just a restart.
      - queue-state:/app/state
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - '127.0.0.1:3001:3001'

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    # Same as the server: after a reboot the UI comes back on its own.
    restart: unless-stopped
    environment:
      # The UI container talks to the server on the browser's behalf and holds
      # the token for it: the browser sends no Authorization header of its own.
      - API_TOKEN=${API_TOKEN:-}
    depends_on:
      - server
    ports:
      - '127.0.0.1:3000:80'

volumes:
  es-data:
  queue-state:
