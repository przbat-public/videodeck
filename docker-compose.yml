# Self-hosted stack: Elasticsearch + server + client.
#
#   docker compose up -d --build
#
# Point VIDEOS_FOLDER_PATH at your video library and mount it read-write into
# the server container (the path inside the container must match the env
# value). See docs/DEPLOYMENT.md.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # Elasticsearch is a rebuildable cache for this app, not the store of
      # record (the video folders are) — replicas are wasted I/O.
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - '127.0.0.1:9200:9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9200 >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      - HOST=0.0.0.0
      - PORT=3001
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - VIDEOS_FOLDER_PATH=/videos
      # Generate one: openssl rand -hex 32
      - API_TOKEN=${API_TOKEN:-}
      - REQUIRE_API_TOKEN=${REQUIRE_API_TOKEN:-true}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
    volumes:
      # Replace /path/to/videos with your library root.
      - /path/to/videos:/videos
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - '127.0.0.1:3001:3001'

  client:
    build:
      context: ..
      dockerfile: client/Dockerfile
    depends_on:
      - server
    ports:
      - '127.0.0.1:3000:80'

volumes:
  es-data:
