version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: 'chore(deps)'
    labels: [dependencies]
    groups:
      prod-deps:
        dependency-type: production
      dev-deps:
        dependency-type: development
    ignore:
      # TypeScript majors break the test toolchain (ts-jest, vitest plugins)
      # until they are upgraded together — let that be a manual change.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # The runtime is pinned to Node 22 (.nvmrc); type majors must follow a
      # Node upgrade, not lead it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: 'chore(deps)'
    labels: [dependencies]
    groups:
      prod-deps:
        dependency-type: production
      dev-deps:
        dependency-type: development
    ignore:
      # TypeScript majors break the test toolchain (ts-jest, vitest plugins)
      # until they are upgraded together — let that be a manual change.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # The runtime is pinned to Node 22 (.nvmrc); type majors must follow a
      # Node upgrade, not lead it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: 'chore(deps)'
    labels: [dependencies]
    groups:
      prod-deps:
        dependency-type: production
      dev-deps:
        dependency-type: development
    ignore:
      # TypeScript majors break the test toolchain (ts-jest, vitest plugins)
      # until they are upgraded together — let that be a manual change.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /chrome-extension
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: 'chore(deps)'
    labels: [dependencies]
    groups:
      prod-deps:
        dependency-type: production
      dev-deps:
        dependency-type: development
    ignore:
      # TypeScript majors break the test toolchain (ts-jest, vitest plugins)
      # until they are upgraded together — let that be a manual change.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
