version: 2
updates:
  # ONE npm entry for the whole workspace. The repo has a single lockfile at
  # the root, so a per-directory entry made Dependabot propose versions the
  # pnpm lockfile never resolves (empty PRs) or an inconsistent state (broken
  # PR). The groups, schedule and ignore rules below cover every workspace
  # package at once; Dependabot matches `dependency-name` across all of them.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # At least as long as pnpm's minimumReleaseAge (pnpm-workspace.yaml):
    # a bump of a version younger than the gate fails the strict install
    cooldown:
      default-days: 3
    versioning-strategy: increase
    commit-message:
      prefix: 'chore(deps)'
    labels: [dependencies]
    groups:
      # Security fixes arrive as one pull request, however many there are:
      # with the whole lockfile visible to GitHub, the first scan can raise
      # a batch of them at once
      security:
        applies-to: security-updates
        patterns: ['*']
      prod-deps:
        dependency-type: production
      dev-deps:
        dependency-type: development
    ignore:
      # TypeScript majors break the type-aware lint toolchain
      # (typescript-eslint peer range) until the two move together; let that
      # be a manual change.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # The runtime is pinned to Node 24 (.nvmrc); type majors must follow a
      # Node upgrade, not lead it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # jsdom 30.1.0 breaks 27 client tests (Radix menus), so the suite-passing
      # version is pinned exactly in client/package.json. Minor and patch
      # releases both wait for a human who re-runs the client suite before
      # moving the pin (a minor rule alone lets patches through); a major
      # still arrives as a pull request.
      - dependency-name: 'jsdom'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']

  # The root covers .github/workflows only; the composite action needs its
  # own directory, or its pins drift from the workflows' (they did).
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
