version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: 'chore(deps)'
    labels: [dependencies]
    groups:
      prod-deps:
        dependency-type: production
      dev-deps:
        dependency-type: development
    ignore:
      # TypeScript majors break the test toolchain (ts-jest, vitest plugins)
      # until they are upgraded together — let that be a manual change.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # zod 4 changes the API (z.record, error handling) — needs a planned
      # migration of shared/schemas.ts before we accept it
      - dependency-name: 'zod'
        update-types: ['version-update:semver-major']
      # v2 changes the API/types — needs a deliberate migration of the
      # channel list (VariableSizeList usage)
      - dependency-name: 'react-window'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /server
    schedule:
