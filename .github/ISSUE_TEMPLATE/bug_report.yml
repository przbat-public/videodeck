name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much as you can.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem. Include the exact UI text or error message if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ordered steps that lead to the problem.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: |
        Server log lines (startup log includes the yt-dlp version), the job log from the UI,
        or the output of the failing command. Redact any personal data or API keys.
      render: shell
  - type: input
    id: ytdlp-version
    attributes:
      label: yt-dlp version
      description: "`yt-dlp --version` — YouTube breaks old releases regularly, so this matters."
      placeholder: e.g. 2026.09.10
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
        - Windows (WSL)
        - Other
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "`node --version`, e.g. v22.x"
