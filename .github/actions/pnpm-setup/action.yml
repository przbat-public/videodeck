name: 'pnpm setup and install'
description: 'Install pnpm, set up the pinned Node runtime with the pnpm cache, and run a frozen install. The job must run actions/checkout before this action, so the local action file exists on disk.'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        # Read from .nvmrc: the runtime pin lives in one file, so CI, the
        # Docker images and local nvm users cannot drift apart.
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      shell: bash
