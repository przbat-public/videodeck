name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly — picks up newly published queries
    - cron: '30 1 * * 1'

# Empty on purpose: the scan asks for its own scopes below, so unrelated
# jobs cannot inherit a write scope.
permissions: {}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # JS/TS analysis works straight from source; autobuild would fail
          # at this monorepo's root (no root build script)
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
