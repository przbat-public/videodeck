name: CodeQL

# Every `uses:` is pinned to a release commit (the trailing comment names the
# version) so a retagged action cannot change what runs here unreviewed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly — picks up newly published queries
    - cron: '30 1 * * 1'

# Empty on purpose: the scan asks for its own scopes below, so unrelated
# jobs cannot inherit a write scope.
permissions: {}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          # JS/TS analysis works straight from source; autobuild would fail
          # at this monorepo's root (no root build script)
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
