name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  # Pull requests run this workflow whatever they touch, and the `changes` job
  # decides which jobs do the work. Filtering the trigger instead left every
  # check below in a pending state on a documentation-only pull request, and
  # the ruleset on `main` requires them by name, so such a pull request could
  # never merge. GitHub counts a skipped job as a success.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every `uses:` below is pinned to a release commit (the trailing comment names
# the version) so a retagged action cannot change what runs here unreviewed.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Documentation-only pull requests still need the checks below to report, so
  # this job runs first and tells the heavy jobs whether there is anything for
  # them to do. A typo fix in a README then costs one lint run instead of the
  # whole pipeline, and every check it skips still reports as successful.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
          # The comparison below needs the base branch, not a one-commit clone.
          fetch-depth: 0
      - name: Decide whether code changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            # The push trigger already ignores documentation-only pushes.
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --quiet origin "$BASE_REF"
          if git diff --quiet "origin/$BASE_REF...HEAD" -- . ':(exclude)*.md' ':(exclude)docs/*' ':(exclude)LICENSE'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # Runs on every pull request on purpose: this job carries the prose gate,
  # which is the only check that reads documentation.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Biome + repository invariants
        run: pnpm run lint
      - name: ESLint (type-aware, React hooks, Playwright)
        run: pnpm run lint:types
      - name: Script typecheck + tests
        run: pnpm run lint:scripts && pnpm run test:scripts
      - name: Dead code and unused dependencies
        run: pnpm run knip
      - name: Architecture boundaries
        run: pnpm run lint:deps
      - name: Prose quality gate (humanizer baseline)
        run: pnpm run humanizer:gate

  format:
    name: Format check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - run: pnpm run format:check

  audit:
    name: pnpm audit (moderate+)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # audit reads the committed lockfile; no install needed
      - run: pnpm audit --audit-level=moderate

  typecheck:
    name: Typecheck (server + client + extension)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - run: pnpm run typecheck

  # Runs on every pull request on purpose, like the lint job. A matrix job
  # expands its name only when it runs, so a skipped one reports the raw
  # `Unit tests (${{ matrix.package }})` and the three names the ruleset
  # requires never appear. The suites are the cheapest of the heavy jobs, and
  # they are worth this: a documentation-only pull request has to report every
  # required check, or it stays blocked.
  unit-tests:
    name: Unit tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: server
            dir: server
            run: pnpm run test
          - package: client
            dir: client
            run: pnpm run test:run
          - package: chrome-extension
            dir: chrome-extension
            run: pnpm run test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Run tests
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.run }}

  client-integration:
    name: Client integration (real backend in-process)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      # The real <App /> against the real backend booted in-process via
      # @videodeck/test-infra (fake ES + mock OpenAI + fake yt-dlp).
      - name: Run client integration suite
        working-directory: client
        run: pnpm run test:integration

  coverage:
    name: Coverage ratchet
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      # Coverage thresholds are the ratchet: the run fails when coverage drops
      # below the committed numbers, for the server, the client and the
      # extension. Raising them is a deliberate commit; nothing rewrites a
      # tracked file during a gate run.
      - name: Enforce coverage thresholds (server + client)
        run: pnpm run test:coverage

  integration:
    name: Server integration (fake yt-dlp + Elasticsearch)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      # The fake binary validates the yt-dlp argument templates offline; the
      # Elasticsearch suite runs against the service container above. Nothing
      # is skipped on CI.
      - name: Run server integration suites
        working-directory: server
        env:
          RUN_YTDLP_INTEGRATION: '1'
          RUN_ES_INTEGRATION: '1'
          ELASTICSEARCH_URL: http://localhost:9200
        run: |
          PATH="$GITHUB_WORKSPACE/scripts/fake-bin:$PATH" \
            pnpm exec vitest run src/services/ytdlp.integration.test.ts src/services/elasticsearch.integration.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, lint, format, typecheck, unit-tests]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - run: pnpm run build:server && pnpm run build:client && pnpm run build:extension
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-dist
          path: client/dist/
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-extension-build
          path: |
            chrome-extension/manifest.json
            chrome-extension/background.js
            chrome-extension/content.js
            chrome-extension/popup.js
            chrome-extension/options.js
          retention-days: 14

  docker-images:
    name: Docker images (build + smoke)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      # The images are what a self-hosted operator actually runs, and until this
      # job existed nothing built them before a release: a broken --prod install
      # (the shared contract has its own zod dependency) or a failed client
      # build first showed up on somebody's server.
      - name: Build both images
        run: |
          docker build -f server/Dockerfile -t videodeck-server:ci .
          docker build -f client/Dockerfile -t videodeck-client:ci .
      - name: Smoke-test the server image
        run: |
          # The image runs as the unprivileged node user and ships a pinned
          # yt-dlp, so a base-image bump that breaks either is caught here.
          test "$(docker run --rm videodeck-server:ci id -u)" = "1000"
          docker run --rm videodeck-server:ci yt-dlp --version
          # No Elasticsearch on purpose: the server answers 503 and reports the
          # cluster as down, which still proves the compiled entrypoint loaded
          # every workspace import from the production-only install. The token
          # is required because the process must bind 0.0.0.0 to be reachable
          # through the published port.
          docker network create smoke
          docker run -d --name server --network smoke --network-alias server -p 8091:3001 \
            -e VIDEOS_FOLDER_PATH=/tmp \
            -e ELASTICSEARCH_URL=http://127.0.0.1:9 \
            -e QUEUE_STATE_FILE=/tmp/queue-state.json \
            -e HOST=0.0.0.0 \
            -e API_TOKEN=smoke \
            -e REQUIRE_API_TOKEN=true \
            videodeck-server:ci
          for _ in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' -H 'Authorization: Bearer smoke' http://127.0.0.1:8091/api/health || true)
            [ "$code" = "503" ] && break
            sleep 1
          done
          test "$code" = "503"
          grep -q '"elasticsearch":"down"' /tmp/health.json
          # The token is enforced inside the image, not only in the tests
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8091/api/health)" = "401"
      - name: Smoke-test the client image
        run: |
          # On the same network as the server, so nginx resolves its upstream at
          # startup (nginx refuses to start when the name does not resolve).
          docker run -d --name client --network smoke -p 8092:80 -e API_TOKEN=smoke videodeck-client:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8092/ -o /tmp/index.html || true
            grep -q '<div id="root">' /tmp/index.html && break
            sleep 1
          done
          grep -q '<div id="root">' /tmp/index.html
          # Through the proxy: the client container holds the token and adds it,
          # so the answer is the server's Elasticsearch-down body rather than a
          # 401, and a broken proxy_pass would answer 502 instead.
          for _ in $(seq 1 30); do
            code=$(curl -s -o /tmp/proxied.json -w '%{http_code}' http://127.0.0.1:8092/api/health || true)
            [ "$code" = "503" ] && break
            sleep 1
          done
          test "$code" = "503"
          grep -q '"elasticsearch":"down"' /tmp/proxied.json
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs server || true
          docker logs client || true

  e2e:
    name: Playwright E2E (mocked API)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Install Playwright browsers + OS deps
        working-directory: client
        run: pnpm exec playwright install --with-deps
      - name: Run Playwright tests
        working-directory: client
        # The config retries a real-browser hiccup twice, but a test that only
        # passed on a retry is a flake: fail the job instead of absorbing it.
        run: pnpm run test:e2e --fail-on-flaky-tests
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          # Matches the `html` reporter output dir in client/playwright.config.ts
          # (relative to that config's directory), which the `list`-only reporter
          # never wrote, so this artifact used to be empty.
          path: client/playwright-report/
          retention-days: 14

  # The default e2e job above runs the dev server and stays the fast feedback
  # loop. This one is the addition from the same suite against the built
  # bundle, so production-only breakage (chunking, minification, base path)
  # cannot ship unnoticed. The local equivalent is `pnpm run test:e2e:preview`
  # from the repo root.
  e2e-preview:
    name: Playwright E2E (production bundle)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Install Playwright browsers + OS deps
        working-directory: client
        run: pnpm exec playwright install --with-deps
      - name: Build the client bundle
        working-directory: client
        run: pnpm run build
      - name: Run Playwright tests against vite preview
        working-directory: client
        env:
          E2E_TARGET: preview
        run: pnpm run test:e2e --fail-on-flaky-tests
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-preview
          path: client/playwright-report/
          retention-days: 14
