name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  # Pull requests run this workflow whatever they touch, and the `changes` job
  # decides which jobs do the work. Filtering the trigger instead left every
  # check below in a pending state on a documentation-only pull request, and
  # the ruleset on `main` requires them by name, so such a pull request could
  # never merge. GitHub counts a skipped job as a success.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every `uses:` below is pinned to a release commit (the trailing comment names
# the version) so a retagged action cannot change what runs here unreviewed.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Documentation-only pull requests still need the checks below to report, so
  # this job runs first and tells the heavy jobs whether there is anything for
  # them to do. A typo fix in a README then costs one lint run instead of the
  # whole pipeline, and every check it skips still reports as successful.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
          # The comparison below needs the base branch, not a one-commit clone.
          fetch-depth: 0
      - name: Decide whether code changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            # The push trigger already ignores documentation-only pushes.
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --quiet origin "$BASE_REF"
          if git diff --quiet "origin/$BASE_REF...HEAD" -- . ':(exclude)*.md' ':(exclude)docs/*' ':(exclude)LICENSE'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # Runs on every pull request on purpose: this job carries the prose gate,
  # which is the only check that reads documentation.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Biome + repository invariants
        run: pnpm run lint
      - name: ESLint (type-aware, React hooks, Playwright)
        run: pnpm run lint:types
      - name: Script typecheck + tests
        run: pnpm run lint:scripts && pnpm run test:scripts
      - name: Dead code and unused dependencies
        run: pnpm run knip
      - name: Architecture boundaries
        run: pnpm run lint:deps
      - name: Prose quality gate (humanizer baseline)
        run: pnpm run humanizer:gate

  format:
    name: Format check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - run: pnpm run format:check

  audit:
    name: pnpm audit (moderate+)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # audit reads the committed lockfile; no install needed
      - run: pnpm audit --audit-level=moderate

  typecheck:
    name: Typecheck (server + client + extension)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - run: pnpm run typecheck

  # Runs on every pull request on purpose, like the lint job. A matrix job
  # expands its name only when it runs, so a skipped one reports the raw
  # `Unit tests (${{ matrix.package }})` and the three names the ruleset
  # requires never appear. The suites are the cheapest of the heavy jobs, and
  # they are worth this: a documentation-only pull request has to report every
  # required check, or it stays blocked.
  unit-tests:
    name: Unit tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: server
            dir: server
            run: pnpm run test
          - package: client
            dir: client
            run: pnpm run test:run
          - package: chrome-extension
            dir: chrome-extension
            run: pnpm run test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Run tests
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.run }}

  client-integration:
    name: Client integration (real backend in-process)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      # The real <App /> against the real backend booted in-process via
      # @videodeck/test-infra (fake ES + mock OpenAI + fake yt-dlp).
      - name: Run client integration suite
        working-directory: client
        run: pnpm run test:integration

  coverage:
    name: Coverage ratchet
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      # Coverage thresholds are the ratchet: the run fails when coverage drops
      # below the committed numbers, for the server, the client and the
      # extension. Raising them is a deliberate commit; nothing rewrites a
      # tracked file during a gate run.
      - name: Enforce coverage thresholds (server + client)
        run: pnpm run test:coverage

  integration:
    # The name predates the real yt-dlp below and stays on purpose: GitHub
    # matches a required status check by name, so a rename would have to land
    # in the ruleset too.
    name: Server integration (fake yt-dlp + Elasticsearch)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      # The yt-dlp the Docker image ships: the version and the extras
      # server/Dockerfile pins, so the impersonate case finds curl_cffi as the
      # image does. `yt-dlp --version` fails the step at once if pipx did not
      # put the binary on PATH.
      - name: Install the pinned yt-dlp
        run: pipx install "yt-dlp[$(sed -n 's/^ARG YTDLP_EXTRAS=//p' server/Dockerfile)]==$(sed -n 's/^ARG YTDLP_VERSION=//p' server/Dockerfile)" && yt-dlp --version
      # The yt-dlp suite checks the argument templates against that binary,
      # offline: every case targets a string that is not a URL. The
      # Elasticsearch suite runs against the service container above. Nothing
      # is skipped on CI. The deep server suites keep the fake yt-dlp in
      # scripts/fake-bin, which they reach through YTDLP_PATH.
      - name: Run server integration suites
        working-directory: server
        env:
          RUN_YTDLP_INTEGRATION: '1'
          RUN_ES_INTEGRATION: '1'
          ELASTICSEARCH_URL: http://localhost:9200
        run: pnpm exec vitest run src/services/ytdlp.integration.test.ts src/services/elasticsearch.integration.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, lint, format, typecheck, unit-tests]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - run: pnpm run build:server && pnpm run build:client && pnpm run build:extension
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-dist
          path: client/dist/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-extension-build
          path: |
            chrome-extension/manifest.json
            chrome-extension/background.js
            chrome-extension/content.js
            chrome-extension/popup.js
            chrome-extension/options.js
          retention-days: 14

  docker-images:
    name: Docker images (build + smoke)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      # scripts/check-compose.test.mjs reads the compose file by indentation.
      # Compose is the parser that counts, so it gets the last word on whether
      # every service caps its log.
      - name: Check the compose file
        run: |
          docker compose config --format json > /tmp/compose.json
          jq -e '(.services | length) == 3 and ([.services[] | .logging.driver == "json-file" and (.logging.options["max-size"] | type) == "string" and (.logging.options["max-file"] | type) == "string"] | all)' /tmp/compose.json
      # The images are what a self-hosted operator actually runs, and until this
      # job existed nothing built them before a release: a broken --prod install
      # (the shared contract has its own zod dependency) or a failed client
      # build first showed up on somebody's server.
      - name: Build both images
        run: |
          docker build -f server/Dockerfile -t videodeck-server:ci .
          docker build -f client/Dockerfile -t videodeck-client:ci .
      - name: Smoke-test the server image
        run: |
          # The image runs as the unprivileged node user and ships a pinned
          # yt-dlp, so a base-image bump that breaks either is caught here.
          test "$(docker run --rm videodeck-server:ci id -u)" = "1000"
          docker run --rm videodeck-server:ci yt-dlp --version
          # yt-dlp carries what the folder options ask of it: curl_cffi for
          # `impersonate: true`, yt-dlp-ejs and a JavaScript runtime for the
          # challenges YouTube sets. No network needed: -v lists the libraries
          # and runtimes it found and stops at the missing URL, while a missing
          # curl_cffi stops it earlier, with a traceback.
          out=$(docker run --rm --network none videodeck-server:ci yt-dlp --ignore-config --impersonate chrome -v 2>&1 || true)
          grep -q 'You must provide at least one URL' <<<"$out" || { echo "::error::yt-dlp cannot impersonate chrome, curl_cffi is missing"; echo "$out"; exit 1; }
          grep -q 'yt_dlp_ejs-' <<<"$out" || { echo "::error::yt-dlp-ejs is missing, so YouTube challenges go unsolved"; echo "$out"; exit 1; }
          grep -q 'JS runtimes: deno-' <<<"$out" || { echo "::error::yt-dlp finds no JavaScript runtime"; echo "$out"; exit 1; }
          # The runtime install is the server's production closure: express is
          # in it, the client's packages and the test tooling are not. The
          # negative check is an if: bash -e never stops on a `!` command.
          docker run --rm videodeck-server:ci ls /app/node_modules/.pnpm > /tmp/server-packages.txt
          grep -q '^express@' /tmp/server-packages.txt
          if grep -E '^(react|react-dom|lucide-react|i18next|typescript|supertest)@' /tmp/server-packages.txt; then
            echo "::error::the server image installs packages the server never loads (listed above)"
            exit 1
          fi
          # No Elasticsearch on purpose: the server answers 503 and reports the
          # cluster as down, which still proves the compiled entrypoint loaded
          # every workspace import from the production-only install. The token
          # is required because the process must bind 0.0.0.0 to be reachable
          # through the published port.
          docker network create smoke
          docker run -d --name server --network smoke --network-alias server -p 8091:3001 \
            -e VIDEOS_FOLDER_PATH=/tmp \
            -e ELASTICSEARCH_URL=http://127.0.0.1:9 \
            -e QUEUE_STATE_FILE=/tmp/queue-state.json \
            -e HOST=0.0.0.0 \
            -e API_TOKEN=smoke \
            -e REQUIRE_API_TOKEN=true \
            videodeck-server:ci
          for _ in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' -H 'Authorization: Bearer smoke' http://127.0.0.1:8091/api/health || true)
            [ "$code" = "503" ] && break
            sleep 1
          done
          test "$code" = "503"
          grep -q '"elasticsearch":"down"' /tmp/health.json
          # The token is enforced inside the image, not only in the tests
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8091/api/health)" = "401"
          # Docker's own probe, run inside the container. It asks the liveness
          # path, which answers while Elasticsearch is down, so the container
          # turns healthy here too.
          for _ in $(seq 1 30); do
            health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' server)
            [ "$health" = "healthy" ] && break
            sleep 2
          done
          test "$health" = "healthy" || { echo "::error::the server container reports health '$health'"; exit 1; }
          # The same probe where nothing listens has to fail, or "healthy"
          # above proves nothing
          probe=$(docker inspect -f '{{index .Config.Healthcheck.Test 3}}' videodeck-server:ci)
          if docker run --rm --network none --entrypoint node videodeck-server:ci -e "$probe"; then
            echo "::error::the server probe passed with no server listening"
            exit 1
          fi
      - name: Smoke-test the client image
        run: |
          # On the same network as the server, so nginx resolves its upstream at
          # startup (nginx refuses to start when the name does not resolve).
          docker run -d --name client --network smoke -p 8092:80 -e API_TOKEN=smoke videodeck-client:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8092/ -o /tmp/index.html || true
            grep -q '<div id="root">' /tmp/index.html && break
            sleep 1
          done
          grep -q '<div id="root">' /tmp/index.html
          # No other site may frame the pages: inside a frame the UI's requests
          # carry its own Origin, and nothing on the server tells them apart
          for page in / /download; do
            headers=$(curl -sI "http://127.0.0.1:8092${page}")
            grep -qi "^content-security-policy: frame-ancestors 'none'" <<<"$headers" || { echo "::error::${page} lacks frame-ancestors 'none'"; echo "$headers"; exit 1; }
            grep -qi '^x-frame-options: deny' <<<"$headers" || { echo "::error::${page} lacks X-Frame-Options DENY"; echo "$headers"; exit 1; }
          done
          # Through the proxy: the client container holds the token and adds it,
          # so the answer is the server's Elasticsearch-down body rather than a
          # 401, and a broken proxy_pass would answer 502 instead.
          for _ in $(seq 1 30); do
            code=$(curl -s -o /tmp/proxied.json -w '%{http_code}' http://127.0.0.1:8092/api/health || true)
            [ "$code" = "503" ] && break
            sleep 1
          done
          test "$code" = "503"
          grep -q '"elasticsearch":"down"' /tmp/proxied.json
          # helmet already sends X-Frame-Options on /api answers; nginx adds none
          test "$(curl -sI http://127.0.0.1:8092/api/health | grep -ci '^x-frame-options:')" = "1"
          # Plain HTTP carries no Sec-Fetch-Site, so the server judges a write by
          # its Origin: the UI's own address, which nginx forwards as
          # X-Forwarded-Host, passes; a foreign page does not, token or no token.
          # Nothing sets ALLOWED_HOSTS here.
          test "$(curl -s -o /dev/null -w '%{http_code}' --data '' -H 'Origin: http://evil.example' 'http://127.0.0.1:8092/api/folder/queue/pause?paused=0')" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' --data '' -H 'Origin: http://127.0.0.1:8092' 'http://127.0.0.1:8092/api/folder/queue/pause?paused=0')" = "200"
          # nginx answers its own probe, so the UI turns healthy whatever the
          # server's state, and the probe fails where nginx is not running
          for _ in $(seq 1 30); do
            health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' client)
            [ "$health" = "healthy" ] && break
            sleep 2
          done
          test "$health" = "healthy" || { echo "::error::the client container reports health '$health'"; exit 1; }
          probe=$(docker inspect -f '{{index .Config.Healthcheck.Test 1}}' videodeck-client:ci)
          if docker run --rm --network none --entrypoint sh videodeck-client:ci -c "$probe"; then
            echo "::error::the client probe passed with nginx not running"
            exit 1
          fi
          # nginx logs the page but neither the API nor the probes: the server
          # writes a line for each API request already, and nginx's line would
          # add the query string. stdout only, which is the access log; the
          # error log goes to stderr.
          docker logs client > /tmp/client-access.log 2>/dev/null
          grep -q '"GET / HTTP/1.1" 200' /tmp/client-access.log
          if grep -E 'GET /(api/|health/live)' /tmp/client-access.log; then
            echo "::error::nginx writes API requests or probes to its access log (listed above)"
            exit 1
          fi
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs server || true
          docker logs client || true
          # The last probe answers, for a container that never turned healthy
          docker inspect -f '{{.Name}} {{json .State.Health}}' server client || true

  e2e:
    name: Playwright E2E (mocked API)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Install Playwright browsers + OS deps
        working-directory: client
        run: pnpm exec playwright install --with-deps
      - name: Run Playwright tests
        working-directory: client
        # The config retries a real-browser hiccup twice, but a test that only
        # passed on a retry is a flake: fail the job instead of absorbing it.
        run: pnpm run test:e2e --fail-on-flaky-tests
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          # Matches the `html` reporter output dir in client/playwright.config.ts
          # (relative to that config's directory), which the `list`-only reporter
          # never wrote, so this artifact used to be empty.
          path: client/playwright-report/
          retention-days: 14

  # The default e2e job above runs the dev server and stays the fast feedback
  # loop. This one is the addition from the same suite against the built
  # bundle, so production-only breakage (chunking, minification, base path)
  # cannot ship unnoticed. The local equivalent is `pnpm run test:e2e:preview`
  # from the repo root.
  e2e-preview:
    name: Playwright E2E (production bundle)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Install Playwright browsers + OS deps
        working-directory: client
        run: pnpm exec playwright install --with-deps
      - name: Build the client bundle
        working-directory: client
        run: pnpm run build
      - name: Run Playwright tests against vite preview
        working-directory: client
        env:
          E2E_TARGET: preview
        run: pnpm run test:e2e --fail-on-flaky-tests
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-preview
          path: client/playwright-report/
          retention-days: 14

  # The check the ruleset needs for this workflow. Required checks are listed
  # by name, and GitHub counts a skipped job as a pass: a job added here gated
  # nothing until the ruleset was edited too, and a failed `changes` job
  # skipped every job behind it, so a pull request whose pipeline never ran
  # could still merge. This job runs whatever happened and fails unless every
  # job passed, or was skipped because the change touched documentation only.
  # It covers this workflow alone: dependency-review and CodeQL run in their
  # own workflows, `needs` cannot reach them, and they stay required by name.
  # scripts/check-ci-gate.test.mjs keeps `needs` in step with the jobs above.
  ci-ok:
    name: CI ok
    if: always()
    needs:
      - changes
      - lint
      - format
      - audit
      - typecheck
      - unit-tests
      - client-integration
      - coverage
      - integration
      - build
      - docker-images
      - e2e
      - e2e-preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or skipped for a documentation-only change
        env:
          RESULTS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.code == 'false' }}
        run: |
          failed=$(jq -r --arg docsOnly "$DOCS_ONLY" '
            to_entries[]
            | select(.value.result != "success")
            | select(.value.result != "skipped" or $docsOnly != "true")
            | "\(.key): \(.value.result)"' <<< "$RESULTS")
          if [ -n "$failed" ]; then
            echo "These jobs did not pass:"
            echo "$failed"
            exit 1
          fi
          echo "Every job passed, or was skipped for a documentation-only change."
