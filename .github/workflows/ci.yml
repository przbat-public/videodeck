name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Biome + repository invariants
        run: pnpm run lint
      - name: ESLint (type-aware, React hooks, Playwright)
        run: pnpm run lint:types
      - name: Script typecheck + tests
        run: pnpm run lint:scripts && pnpm run test:scripts
      - name: Dead code and unused dependencies
        run: pnpm run knip
      - name: Architecture boundaries
        run: pnpm run lint:deps

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  audit:
    name: pnpm audit (moderate+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # audit reads the committed lockfile; no install needed
      - run: pnpm audit --audit-level=moderate

  typecheck:
    name: Typecheck (server + client + extension)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  unit-tests:
    name: Unit tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: server
            dir: server
            run: pnpm run test
          - package: client
            dir: client
            run: pnpm run test:run
          - package: chrome-extension
            dir: chrome-extension
            run: pnpm run test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run tests
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.run }}

  client-integration:
    name: Client integration (real backend in-process)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The real <App /> against the real backend booted in-process via
      # @videodeck/test-infra (fake ES + mock OpenAI + fake yt-dlp).
      - name: Run client integration suite
        working-directory: client
        run: pnpm run test:integration

  coverage:
    name: Coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Coverage thresholds are the ratchet: the run fails when coverage drops
      # below the committed numbers. Locally, `pnpm run test:coverage` raises
      # them in place whenever coverage grows — commit the change.
      - name: Enforce coverage thresholds (server + client)
        run: pnpm run test:coverage

  integration:
    name: Server integration (fake yt-dlp + Elasticsearch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.2.8
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 24
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The fake binary validates the yt-dlp argument templates offline; the
      # Elasticsearch suite runs against the service container above. Nothing
      # is skipped on CI.
      - name: Run server integration suites
        working-directory: server
        env:
          RUN_YTDLP_INTEGRATION: '1'
          RUN_ES_INTEGRATION: '1'
          ELASTICSEARCH_URL: http://localhost:9200
        run: |
          PATH="$GITHUB_WORKSPACE/scripts/fake-bin:$PATH" \
            npx jest src/services/ytdlp.integration.test.ts src/services/elasticsearch.integration.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, format, typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:server && pnpm run build:client && pnpm run build:extension
      - uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: client/dist/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: chrome-extension-build
          path: |
            chrome-extension/manifest.json
            chrome-extension/background.js
            chrome-extension/content.js
            chrome-extension/popup.js
            chrome-extension/options.js
          retention-days: 14

  e2e:
    name: Playwright E2E (mocked API)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers + OS deps
        working-directory: client
        run: pnpm exec playwright install --with-deps
      - name: Run Playwright tests
        working-directory: client
        run: pnpm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 14
