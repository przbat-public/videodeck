name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
            chrome-extension/package-lock.json
      # Root install matters: shared/*.ts resolves zod from the repo root.
      # knip also needs each package's node_modules to verify dependency
      # ownership, so install all four packages.
      - run: npm run install:ci
      - name: Biome + repository invariants
        run: npm run lint
      - name: ESLint (type-aware, React hooks, Playwright)
        run: npm run lint:types
      - name: Script typecheck + tests
        run: npm run lint:scripts && npm run test:scripts
      - name: Dead code and unused dependencies
        run: npm run knip
      - name: Architecture boundaries
        run: npm run lint:deps

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
            chrome-extension/package-lock.json
      - run: npm ci
      - run: npm run format:check

  audit:
    name: npm audit (moderate+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # audit reads the committed lockfiles; no install needed
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix server --audit-level=moderate
      - run: npm audit --prefix client --audit-level=moderate
      - run: npm audit --prefix chrome-extension --audit-level=moderate

  typecheck:
    name: Typecheck (server + client + extension)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
            chrome-extension/package-lock.json
      # Root install matters: shared/*.ts resolves zod from the repo root
      - run: npm run install:ci
      - run: npm run typecheck

  unit-tests:
    name: Unit tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: server
            dir: server
            run: npm test
          - package: client
            dir: client
            run: npm run test:run
          - package: chrome-extension
            dir: chrome-extension
            run: npm test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
            chrome-extension/package-lock.json
      - run: npm ci && npm ci --prefix ${{ matrix.dir }}
      - name: Run tests
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.run }}

  coverage:
    name: Coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - run: npm run install:ci
      # Coverage thresholds are the ratchet: the run fails when coverage drops
      # below the committed numbers. Locally, `npm run test:coverage` raises
      # them in place whenever coverage grows — commit the change.
      - name: Enforce coverage thresholds (server + client)
        run: npm run test:coverage

  integration:
    name: Server integration (fake yt-dlp + Elasticsearch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.1.10
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci && npm ci --prefix server
      # The fake binary validates the yt-dlp argument templates offline; the
      # Elasticsearch suite runs against the service container above. Nothing
      # is skipped on CI.
      - name: Run server integration suites
        working-directory: server
        env:
          RUN_YTDLP_INTEGRATION: '1'
          RUN_ES_INTEGRATION: '1'
          ELASTICSEARCH_URL: http://localhost:9200
        run: |
          PATH="$GITHUB_WORKSPACE/scripts/fake-bin:$PATH" \
            npx jest src/services/ytdlp.integration.test.ts src/services/elasticsearch.integration.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, format, typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
            chrome-extension/package-lock.json
      - run: npm run install:ci
      - run: npm run build:server && npm run build:client && npm run build:extension
      - uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: client/dist/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: chrome-extension-build
          path: |
            chrome-extension/manifest.json
            chrome-extension/background.js
            chrome-extension/content.js
            chrome-extension/popup.js
            chrome-extension/options.js
          retention-days: 14

  e2e:
    name: Playwright E2E (mocked API)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci && npm ci --prefix client
      - name: Install Playwright browsers + OS deps
        working-directory: client
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        working-directory: client
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 14
