name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# Every `uses:` below is pinned to a release commit (the trailing comment names
# the version) so a retagged action cannot change what runs here unreviewed.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Biome + repository invariants
        run: pnpm run lint
      - name: ESLint (type-aware, React hooks, Playwright)
        run: pnpm run lint:types
      - name: Script typecheck + tests
        run: pnpm run lint:scripts && pnpm run test:scripts
      - name: Dead code and unused dependencies
        run: pnpm run knip
      - name: Architecture boundaries
        run: pnpm run lint:deps
      - name: Prose quality gate (humanizer baseline)
        run: pnpm run humanizer:gate

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - run: pnpm run format:check

  audit:
    name: pnpm audit (moderate+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # audit reads the committed lockfile; no install needed
      - run: pnpm audit --audit-level=moderate

  typecheck:
    name: Typecheck (server + client + extension)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - run: pnpm run typecheck

  unit-tests:
    name: Unit tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: server
            dir: server
            run: pnpm run test
          - package: client
            dir: client
            run: pnpm run test:run
          - package: chrome-extension
            dir: chrome-extension
            run: pnpm run test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Run tests
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.run }}

  client-integration:
    name: Client integration (real backend in-process)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      # The real <App /> against the real backend booted in-process via
      # @videodeck/test-infra (fake ES + mock OpenAI + fake yt-dlp).
      - name: Run client integration suite
        working-directory: client
        run: pnpm run test:integration

  coverage:
    name: Coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      # Coverage thresholds are the ratchet: the run fails when coverage drops
      # below the committed numbers. Locally, `pnpm run test:coverage` raises
      # them in place whenever coverage grows — commit the change.
      - name: Enforce coverage thresholds (server + client)
        run: pnpm run test:coverage

  integration:
    name: Server integration (fake yt-dlp + Elasticsearch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      # The fake binary validates the yt-dlp argument templates offline; the
      # Elasticsearch suite runs against the service container above. Nothing
      # is skipped on CI.
      - name: Run server integration suites
        working-directory: server
        env:
          RUN_YTDLP_INTEGRATION: '1'
          RUN_ES_INTEGRATION: '1'
          ELASTICSEARCH_URL: http://localhost:9200
        run: |
          PATH="$GITHUB_WORKSPACE/scripts/fake-bin:$PATH" \
            npx jest src/services/ytdlp.integration.test.ts src/services/elasticsearch.integration.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, format, typecheck, unit-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - run: pnpm run build:server && pnpm run build:client && pnpm run build:extension
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-dist
          path: client/dist/
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-extension-build
          path: |
            chrome-extension/manifest.json
            chrome-extension/background.js
            chrome-extension/content.js
            chrome-extension/popup.js
            chrome-extension/options.js
          retention-days: 14

  e2e:
    name: Playwright E2E (mocked API)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Install Playwright browsers + OS deps
        working-directory: client
        run: pnpm exec playwright install --with-deps
      - name: Run Playwright tests
        working-directory: client
        # The config retries a real-browser hiccup twice, but a test that only
        # passed on a retry is a flake: fail the job instead of absorbing it.
        run: pnpm run test:e2e --fail-on-flaky-tests
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          # Matches the `html` reporter output dir in client/playwright.config.ts
          # (relative to that config's directory), which the `list`-only reporter
          # never wrote, so this artifact used to be empty.
          path: client/playwright-report/
          retention-days: 14

  # The default e2e job above runs the dev server and stays the fast feedback
  # loop. This one is the addition from the same suite against the built
  # bundle, so production-only breakage (chunking, minification, base path)
  # cannot ship unnoticed. The local equivalent is `pnpm run test:e2e:preview`
  # from the repo root.
  e2e-preview:
    name: Playwright E2E (production bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Install Playwright browsers + OS deps
        working-directory: client
        run: pnpm exec playwright install --with-deps
      - name: Build the client bundle
        working-directory: client
        run: pnpm run build
      - name: Run Playwright tests against vite preview
        working-directory: client
        env:
          E2E_TARGET: preview
        run: pnpm run test:e2e --fail-on-flaky-tests
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-preview
          path: client/playwright-report/
          retention-days: 14
