name: Nightly order randomisation

# Per-PR runs stay deterministic on purpose: a red check has to mean the diff
# broke something. This workflow asks the other question on a schedule, with a
# fixed seed so a failure here is reproducible with the same command locally.
#
# Local equivalents (seeds as used here):
#   cd server && pnpm run test --sequence.shuffle.tests --sequence.seed=9137
#   cd server && pnpm run test --sequence.shuffle.tests          # the fresh seed
#   cd client && pnpm run test:run --sequence.shuffle.tests --sequence.seed=9137
#   cd client && pnpm run test:integration --sequence.shuffle.tests --sequence.seed=9137
#
# One job per layer, so a red run in one of them cannot hide the state of the
# others. All three are green at this seed, measured on 2026-09-28: server unit
# 679 tests, client unit and client integration 25 tests, each with the seed
# below. A red run is therefore a real order dependency that arrived with a
# change, not a baseline to ignore, and it is paid down before the next one.
#
# The server also gets a job with no pinned seed. A fixed seed exercises exactly
# one order forever, and the port to Vitest showed how much that leaves on the
# table: the pinned order was green while a different one found two tests that
# depended on their neighbours. Vitest prints the seed it drew ("Running tests
# with seed ..."), so a fresh-seed failure is still reproducible from the log.

on:
  schedule:
    # Daily at 02:30 UTC, ahead of the working day
    - cron: '30 2 * * *'
  # Manual runs only otherwise: this is not a required check and never runs
  # on a pull request.
  workflow_dispatch:

# Every `uses:` below is pinned to a release commit (the trailing comment names
# the version) so a retagged action cannot change what runs here unreviewed.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-random-order:
    name: Server unit tests (random order)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      # vitest 5.0.2: sequence.shuffle.tests shuffles the tests inside each file
      # and sequence.seed pins the order, the same contract jest --randomize had.
      - name: Server unit tests in a random order
        working-directory: server
        run: pnpm run test --sequence.shuffle.tests --sequence.seed=9137

  server-random-order-fresh-seed:
    name: Server unit tests (random order, fresh seed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      # No seed here on purpose: vitest draws one, prints it in the run
      # ("Running tests with seed ..."), and the next night draws another. The
      # job above stays for the failure it can reproduce with one command.
      - name: Server unit tests in a fresh random order
        working-directory: server
        run: pnpm run test --sequence.shuffle.tests

  client-random-order:
    name: Client unit tests (random order)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      # vitest 5.0.1: sequence.shuffle.tests shuffles the tests inside each
      # file and sequence.seed pins the order.
      - name: Client unit tests in a random order
        working-directory: client
        run: pnpm run test:run --sequence.shuffle.tests --sequence.seed=9137

  client-integration-random-order:
    name: Client integration (random order)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the clone; leaving it in .git/config
          # would let a later build step push with it.
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Client integration tests in a random order
        working-directory: client
        run: pnpm run test:integration --sequence.shuffle.tests --sequence.seed=9137
