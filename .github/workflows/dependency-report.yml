name: Dependency report

# Both `uses:` entries are pinned to a release commit (the trailing comment
# names the version) so a retagged action cannot change what runs unreviewed.

on:
  schedule:
    # Every Monday at 08:00 UTC.
    - cron: '0 8 * * 1'
  workflow_dispatch:

# Empty on purpose: the job that publishes the issue asks for exactly what it
# needs, so a step in another job cannot inherit a write scope.
permissions: {}

jobs:
  report:
    name: Generate and publish dependency report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # `pnpm outdated`/`pnpm audit` only read package.json + the workspace
      # lockfile, so no install step is needed (pnpm ships with the runner).
      - name: Generate report
        run: node scripts/dependency-report.mjs > /tmp/dependency-report.md
      - name: Create or update the report issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Match by title prefix: any other open issue carrying the
          # `dependencies` label must not be overwritten.
          NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label dependencies --state open --search 'Dependency report in:title' \
            --json number --jq '.[0].number // empty')"
          TITLE="Dependency report $(date +%Y-%m-%d)"
          if [ -z "$NUMBER" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --label dependencies \
              --body-file /tmp/dependency-report.md
          else
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --body-file /tmp/dependency-report.md
          fi
