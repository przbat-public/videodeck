name: Stale issue and PR cleanup

on:
  schedule:
    # Daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 90
          days-before-close: 30
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: 'This issue has been open for 90 days without activity. It will be closed in 30 days unless there is new activity.'
          stale-pr-message: 'This PR has had no activity for 90 days. It will be closed in 30 days unless there is new activity.'
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned
          operations-per-run: 50
