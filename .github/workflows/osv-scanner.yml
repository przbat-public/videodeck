name: OSV Scanner

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1' # weekly
  workflow_dispatch:
  pull_request:
    paths:
      - '**/package-lock.json'

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  # Full scan of every lockfile on main and weekly: fails when known
  # vulnerabilities exist, reports to the Code scanning dashboard.
  scan-scheduled:
    if: github.event_name != 'pull_request'
    uses: 'google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0'

  # Compares the PR branch against main and only reports NEW vulnerabilities
  # introduced by the PR (warns by default — it does not block the merge).
  scan-pr:
    if: github.event_name == 'pull_request'
    uses: 'google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.6.0'
