name: OSV Scanner

# Both reusable workflows are pinned to a release commit, named in the comment
# after each `uses:`: a retagged `@v2` would otherwise change the scan without
# any diff to review.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1' # weekly
  workflow_dispatch:
  pull_request:
    paths:
      - '**/pnpm-lock.yaml'

# Empty on purpose: each scan asks for its own scopes below.
permissions: {}

jobs:
  # Full scan of every lockfile on main and weekly: fails when known
  # vulnerabilities exist, reports to the Code scanning dashboard.
  scan-scheduled:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1

  # Compares the PR branch against main and only reports NEW vulnerabilities
  # introduced by the PR (it warns by default and does not block the merge).
  scan-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
