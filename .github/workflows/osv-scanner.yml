name: OSV Scanner

# Both reusable workflows are pinned to the v2.6.0 release commit: a retagged
# `@v2` would otherwise change the scan without any diff to review.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1' # weekly
  workflow_dispatch:
  pull_request:
    paths:
      - '**/pnpm-lock.yaml'

# Empty on purpose: each scan asks for its own scopes below.
permissions: {}

jobs:
  # Full scan of every lockfile on main and weekly: fails when known
  # vulnerabilities exist, reports to the Code scanning dashboard.
  scan-scheduled:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0

  # Compares the PR branch against main and only reports NEW vulnerabilities
  # introduced by the PR (warns by default — it does not block the merge).
  scan-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
