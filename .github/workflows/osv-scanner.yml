name: OSV Scanner

# Both reusable workflows are pinned to the v2.6.0 release commit: a retagged
# `@v2` would otherwise change the scan without any diff to review.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1' # weekly
  workflow_dispatch:
  pull_request:
    paths:
      - '**/pnpm-lock.yaml'

# Empty on purpose: each scan asks for its own scopes below.
permissions: {}

jobs:
  # Full scan of every lockfile on main and weekly: fails when known
  # vulnerabilities exist, reports to the Code scanning dashboard.
  scan-scheduled:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0

  # Compares the PR branch against main and only reports NEW vulnerabilities
  # introduced by the PR (warns by default — it does not block the merge).
  scan-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
