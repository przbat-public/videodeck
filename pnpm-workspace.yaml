packages:
  - server
  - client
  - chrome-extension
  - shared
  - test-infra

# pnpm 11+ settings: which packages may run their install scripts
allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  unrs-resolver: true

# A freshly published version stays out of the lockfile for a day: most
# hijacked releases are caught and pulled inside that window, and no audit
# can flag a package nobody has reported yet. pnpm 12 has the same default
# but applies it leniently; a value written here is strict. Dependabot's
# cooldown in .github/dependabot.yml waits at least as long, and
# scripts/check-supply-chain.test.mjs keeps the two in step.
minimumReleaseAge: 1440

# The lockfile holds the resolved tree and nothing else. Left alone, pnpm 12
# writes a first YAML document that records its own version, and GitHub's
# dependency graph reads only that document: it saw 15 pnpm packages and none
# of the 700 the app runs on, so Dependabot never raised an alert. `ignore`
# keeps the document out. It also stops pnpm from switching to, or insisting
# on, the pinned version locally; CI (pnpm/action-setup) and Docker
# (corepack) still read the pin from `packageManager`.
pmOnFail: ignore
